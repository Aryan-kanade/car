<!doctype html>
<html lang="en" class="bg-white dark:bg-zinc-950">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply stored/system theme before first paint to avoid a flash
      ;(function () {
        try {
          var stored = localStorage.getItem('kmkiramyki-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* no-op */
        }
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="KMKIRAMYKI Advanced Chemistry — pH-balanced detailing chemistry, ceramic-grade protection and studio-tested tools for the enthusiast who notices every detail."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:site_name" content="KMKIRAMYKI" />
    <meta property="og:title" content="KMKIRAMYKI Advanced Chemistry — Premium Car Care" />
    <meta
      property="og:description"
      content="pH-balanced detailing chemistry, ceramic-grade protection and studio-tested tools — engineered for the enthusiast who notices every detail."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>KMKIRAMYKI Advanced Chemistry — Premium Car Care</title>
  </head>

</html>
